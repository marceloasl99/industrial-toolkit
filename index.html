<!doctype html>
<html lang="en" data-theme="auto">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="Offline converters and utilities for IT, OT, cybersecurity, IoT and Industry 4.0. 52 tools, no server, no account." />
    <meta name="theme-color" content="#07111f" />
    <meta name="color-scheme" content="dark light" />
    <title>ForgeTools | Engineering Utility Suite</title>
    <link rel="icon" href="assets/favicon.svg" type="image/svg+xml" />
    <link rel="apple-touch-icon" href="assets/icon-192.png" />
    <link rel="manifest" href="manifest.json" />
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <a class="skip-link" href="#app">Skip to content</a>
    <aside class="sidebar" id="sidebar">
      <a class="brand" href="#/" aria-label="ForgeTools home"><span class="brand-mark">F</span><span>Forge<span>Tools</span></span></a>
      <label class="search"><span aria-hidden="true">⌕</span><input id="tool-search" type="search" placeholder="Search tools…" autocomplete="off" aria-label="Search tools" /><kbd>Ctrl K</kbd></label>
      <nav id="tool-nav" aria-label="Tool navigation"></nav>
      <div class="sidebar-footer"><span class="status-dot" aria-hidden="true"></span> <span id="sidebar-note">Runs locally in your browser</span></div>
    </aside>
    <main>
      <div id="update-bar" class="update-bar" hidden><span>A new version is available.</span><button class="button">Reload</button></div>
      <header class="topbar">
        <button class="mobile-menu" id="menu-button" aria-label="Open menu" aria-controls="sidebar">☰</button>
        <div id="crumb" aria-live="polite">Dashboard</div>
        <div class="topbar-actions">
          <button id="install-button" class="icon-button" hidden>Install app</button>
          <button id="theme-button" class="icon-button" title="Theme" aria-label="Toggle theme">◐</button>
          <a id="about-link" class="icon-button link-button" href="#/about" title="About & settings">About</a>
          <a class="github-link" href="https://github.com/marceloasl99/industrial-toolkit" target="_blank" rel="noreferrer">GitHub ↗</a>
        </div>
      </header>
      <section id="app" class="app" tabindex="-1"></section>
    </main>
    <noscript><p style="padding:2rem;font-family:sans-serif">ForgeTools needs JavaScript. Every tool runs locally; nothing is sent to a server.</p></noscript>
    <script type="module" src="src/app.js"></script>
  </body>
</html>
